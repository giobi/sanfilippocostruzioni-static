<style>
/* Fix mobile menu toggle */
@media (max-width: 1024px) {
  .elementor-nav-menu--dropdown.elementor-nav-menu__container {
    display: none !important;
  }
  
  .elementor-nav-menu--dropdown.elementor-nav-menu__container.elementor-active {
    display: block !important;
  }
  
  .elementor-menu-toggle {
    cursor: pointer;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Mobile menu toggle
  const toggles = document.querySelectorAll('.elementor-menu-toggle');
  
  toggles.forEach(toggle => {
    toggle.addEventListener('click', function() {
      const parent = this.closest('.elementor-nav-menu');
      const dropdown = parent.querySelector('.elementor-nav-menu--dropdown');
      
      if (dropdown) {
        dropdown.classList.toggle('elementor-active');
        const isExpanded = dropdown.classList.contains('elementor-active');
        this.setAttribute('aria-expanded', isExpanded);
        dropdown.setAttribute('aria-hidden', !isExpanded);
      }
    });
  });
});
</script>
